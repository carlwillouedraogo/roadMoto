spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sorties_moto
    username: moto
    password: moto
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  jwt:
    # Clé encodée en Base64 (min. 256 bits) — générer avec : openssl rand -base64 32
    secret: ${JWT_SECRET:ld/zZZx2vtWmdeNZ1p+Yp8R9j7xpRugscmfopCt33Iw=}
    expiration-ms: 86400000   # 24h

server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true